name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 与 ci.yml 相同的构建矩阵（构建逻辑共用 .github/actions/build）
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04
            container: ubuntu:24.04
            onnx: download
            cpack: DEB
            git_cmd: apt-get update -qq && apt-get install -y -qq git
          - name: ubuntu-26.04
            container: ubuntu:26.04
            onnx: system
            cpack: DEB
            git_cmd: apt-get update -qq && apt-get install -y -qq git
          - name: debian-12
            container: debian:12
            onnx: download
            cpack: DEB
            git_cmd: apt-get update -qq && apt-get install -y -qq git
          - name: debian-13
            container: debian:13
            onnx: system
            cpack: DEB
            git_cmd: apt-get update -qq && apt-get install -y -qq git
          - name: fedora-44
            container: fedora:44
            onnx: system
            cpack: RPM
            git_cmd: dnf install -y git
          - name: opensuse-tumbleweed
            container: opensuse/tumbleweed
            onnx: system
            cpack: RPM
            git_cmd: zypper --non-interactive --gpg-auto-import-keys refresh && zypper --non-interactive install -y git
    steps:
      # 最小容器镜像不带 git，checkout 需要；同时为 actions/checkout 的
      # submodules 支持提供 git（REST 回退不支持 submodules）
      - name: Install git (container bootstrap)
        shell: bash
        run: ${{ matrix.git_cmd }}

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/build
        with:
          distro: ${{ matrix.name }}
          onnx_strategy: ${{ matrix.onnx }}
          cpack_generator: ${{ matrix.cpack }}

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: |
            *.deb
            *.rpm
          if-no-files-found: error

  verify:
    name: verify hardened addon loading
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install git (container bootstrap)
        shell: bash
        run: apt-get update -qq && apt-get install -y -qq git

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/build
        with:
          distro: ubuntu-24.04
          onnx_strategy: download
          run_verify: "true"

  arch:
    name: build (archlinux)
    runs-on: ubuntu-latest
    container: archlinux
    steps:
      - name: Install git (container bootstrap)
        shell: bash
        run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          pacman -Syu --noconfirm base-devel git cmake pkg-config gettext \
            fcitx5 pipewire libpulse jsoncpp curl onnxruntime-cpu

      # prepare.sh 用 git archive 生成源码包；容器内 checkout 文件属主与 git 用户
      # 可能不一致（宿主挂载场景），显式声明 safe.directory 避免 dubious ownership
      - name: Mark workspace as safe for git
        shell: bash
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - uses: ./.github/actions/aur

      - uses: actions/upload-artifact@v7
        with:
          name: package-arch
          path: |
            dist/aur/*.pkg.tar.zst
            dist/aur/PKGBUILD
            dist/aur/src/*.tar.gz
          if-no-files-found: error

  release:
    name: Create draft release
    needs: [build, verify, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # softprops/action-gh-release v3（2026-07 恢复维护，含上传传输加固）；
      # 产物经 download-artifact merge 后位于 dist/ 下，files 支持 glob
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          name: fcitx5-voice-input ${{ github.ref_name }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/PKGBUILD
            dist/src/*.tar.gz
