name: Build fcitx5-voice-input
description: Install deps, configure, compile, and package DEB

inputs:
  build_type:
    description: CMake build type
    required: false
    default: Release
  capture_pkgs:
    description: apt packages for audio capture backends (override to simulate a missing backend)
    required: false
    default: "libpipewire-0.3-dev libspa-0.2-dev libpulse-dev"

outputs:
  deb_path:
    description: Path to the built DEB package
    value: ${{ steps.deb.outputs.path }}

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          libfcitx5core-dev \
          ${{ inputs.capture_pkgs }} \
          gettext \
          libjsoncpp-dev \
          libcurl4-openssl-dev \
          zlib1g-dev \
          dpkg-dev

    - name: Install ONNX Runtime
      shell: bash
      run: |
        # 固定版本：Ubuntu/Debian 官方仓库无 onnxruntime 包，只能从 upstream release 下载。
        # 升级时同步修改此版本号（需与 ABI 兼容的运行时/打包依赖）。
        ONNX_VER=1.20.1
        ONNX_URL="https://github.com/microsoft/onnxruntime/releases/download/v${ONNX_VER}/onnxruntime-linux-x64-${ONNX_VER}.tgz"
        curl -fsSL "$ONNX_URL" -o /tmp/onnxruntime.tgz
        tar -xzf /tmp/onnxruntime.tgz -C /tmp
        echo "ONNXRUNTIME_ROOT=/tmp/onnxruntime-linux-x64-${ONNX_VER}" >> $GITHUB_ENV

    - name: Configure
      shell: bash
      run: >-
        cmake -B build -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} -DCMAKE_INSTALL_PREFIX=/usr
        -DONNXRUNTIME_ROOT="${ONNXRUNTIME_ROOT}" -DCMAKE_MODULE_LINKER_FLAGS="-Wl,-z,now"

    - name: Compile
      shell: bash
      run: cmake --build build -j"$(nproc)"

    # The capture libraries are intentionally runtime-loaded. Build success alone
    # does not catch a direct pw_*/pa_* reference: with DF_1_NOW it only fails
    # when fcitx dlopen()s the addon.
    - name: Verify hardened addon loading
      shell: bash
      run: |
        set -euo pipefail
        export LC_ALL=C
        addon="${PWD}/build/voice-input-addon.so"

        if nm -D --undefined-only "${addon}" | awk '{print $NF}' | grep -qE '^(pw_|pa_)'; then
          echo "::error::addon has unresolved PipeWire/PulseAudio symbols"
          nm -D --undefined-only "${addon}" | awk '$NF ~ /^(pw_|pa_)/ {print}'
          exit 1
        fi

        if readelf -dW "${addon}" | grep -qE 'Shared library: \[lib(pipewire|pulse)'; then
          echo "::error::addon unexpectedly has a capture-library DT_NEEDED entry"
          readelf -dW "${addon}" | grep -E 'Shared library: \[lib(pipewire|pulse)' || true
          exit 1
        fi

        if ! readelf -dW "${addon}" | grep -qE 'BIND_NOW|FLAGS_1.*NOW'; then
          echo "::error::addon was not linked with DF_1_NOW"
          exit 1
        fi

        cat >/tmp/voice-input-dlopen-smoke.c <<'EOF'
        #include <dlfcn.h>
        #include <stdio.h>

        int main(int argc, char **argv) {
            if (argc != 2) {
                return 2;
            }
            void *handle = dlopen(argv[1], RTLD_LAZY | RTLD_LOCAL);
            if (!handle) {
                fprintf(stderr, "dlopen failed: %s\n", dlerror());
                return 1;
            }
            if (dlclose(handle) != 0) {
                fprintf(stderr, "dlclose failed: %s\n", dlerror());
                return 1;
            }
            return 0;
        }
        EOF
        cc -Wall -Wextra -Werror /tmp/voice-input-dlopen-smoke.c -ldl \
          -o /tmp/voice-input-dlopen-smoke
        LD_LIBRARY_PATH="${ONNXRUNTIME_ROOT}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
          /tmp/voice-input-dlopen-smoke "${addon}"

    - name: Package DEB
      id: deb
      shell: bash
      run: |
        cd build
        export LD_LIBRARY_PATH="${ONNXRUNTIME_ROOT}/lib:${LD_LIBRARY_PATH}"
        cpack -G DEB
        mv *.deb ../
        cd ..
        echo "::group::DEB info"
        dpkg-deb --info *.deb
        echo "::endgroup::"
        DEB_FILE=$(ls *.deb | head -1)
        echo "path=${DEB_FILE}" >> $GITHUB_OUTPUT
