name: hotfix
stages:
  - {id: impact, artifact: impact.md, template: impact.md, required_headings: [Impact Matrix, Risks]}
  - {id: tests, artifact: test-plan.md, template: test-plan.md, depends_on: [impact], required_headings: [Strategy, Cases]}
  - {id: implementation, artifact: tasks.md, template: tasks.md, depends_on: [tests], validator: checklist, required_headings: [Tasks]}
  - {id: release, artifact: release-plan.md, template: release-plan.md, depends_on: [implementation], required_headings: [Deployment, Rollback, Verification]}
