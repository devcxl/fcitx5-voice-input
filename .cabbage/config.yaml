version: 1
impact_fields:
- product
- architecture
- api
- database
- security
- testing
- deployment
- operations
- data
- performance
ci:
  require_change_for_code: true
  require_current_state_docs: true
  exclude_prefixes:
  - docs/
  - .cabbage/
  - .github/
  - README
  - LICENSE
  current_state_rules:
    product:
    - docs/01-product/
    architecture:
    - docs/03-architecture/
    api:
    - docs/05-api/
    database:
    - docs/04-data/
    security:
    - docs/09-security/
    testing:
    - docs/08-testing/
    deployment:
    - docs/10-infrastructure/
    - docs/11-ci-cd/
    - docs/12-release/
    operations:
    - docs/13-operations/
    data:
    - docs/04-data/
    performance:
    - docs/14-performance/
docs:
  dir: docs
  # 覆盖 tooling 默认同步映射（cabbage sync / archive 用）：
  # - design/tests/release 的 tech-spec / test-plan / release-plan 是变更工作区
  #   工件，留在 .cabbage/changes|archive/，不写入 docs/（映射值为空即跳过）。
  # - requirement（PRD）同步到 01-product/prd/ 子目录，与既有 prd/ 布局一致。
  # - adr / rfc / api / database / security 沿用 core.py 默认映射。
  mapping:
    requirement: '01-product/prd/{change_id}.md'
    design: ''
    tests: ''
    release: ''
